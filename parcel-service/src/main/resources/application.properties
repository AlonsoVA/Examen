spring.application.name=parcel-service
server.port=8081

# Credenciales de desarrollo. Docker Compose las inyecta por entorno.
# No use estos valores en producción: sustitúyalos por secretos del entorno.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/parcels_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:parcels_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:parcels_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.initialization-fail-timeout=60000

# update ajusta el esquema al arrancar. Es práctico en desarrollo y no se recomienda en producción.
# En producción conviene usar migraciones versionadas.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
